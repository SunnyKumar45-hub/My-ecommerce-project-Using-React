<!DOCTYPE html>
<html>
  <head>
    <title>Practice soln</title>
  </head>
  <body>
    <div class="js-container"> </div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
      <script type="text/babel">
    
        function Para({message, price, discountPrice}) {
          return (
            <>
              
              <p>{message}</p>
            
              {
                discountPrice
                ? (
                  <>
                  <del>
                    <p>Price: ${price}</p>
                  </del> 
                  <p>Discount price: ${discountPrice}</p>
                  </>
                  ) 
                  : (
                    <p>Price: ${price}</p>
                  )
              }

              <button>Add to Cart</button>
            </>
          );
        }
        
        function ProductDetails() {
          return (
            <>
                <img src="cotton-socks.png" width="100"></img>
                <Para 
                  message="Cotton socks" 
                  price="10.90"
                  discountPrice="5.45"
                />
                
                <img src="tennis-balls.png" width="100"></img>
                <Para 
                  message="Tennis balls" 
                  price="6.00"
                />
                
                <img src="plain-t-shirt.png" width="100"></img>
                <Para 
                  message="Plain T-shirt" 
                  price="7.99"
                />
            </>
          );
        }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<ProductDetails/>);
    </script>
  </body>
</html>
