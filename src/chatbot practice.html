<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot Practice</title>
    <style>
      body {
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }
      .chat-input {
        padding: 12px 15px;
        font-size: 15px;
        border-radius: 10px;
        border-width: 1.1px;
        flex-grow: 1;
      }
      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 20px;
        margin-left: 10px;
        font-size: 14px;
        cursor: pointer;
      }
      .app-container {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;

        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;

      }
      .chat-message-robot {
        display: flex;
        align-items: start;
      }
      .chat-message-text {
        background-color: rgb(238, 238,
         238);
        padding:14px 18px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        font-size:15px;
        border-radius: 10px;
        max-width: 300px;
      }
      .chat-message-profile {
        width: 40px;
      }
      .chat-messages-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
      .loading-img {
        height: 40px;
        width: 40px;
        margin: -15px;
      }
    </style>
  </head>

  <body>
    <div class="js-container"></div>

      <script src="https://unpkg.com/supersimpledev/react.js"></script>
        <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

        <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

        <script src="https://unpkg.com/supersimpledev/babel.js"></script>
        <script type="text/babel">

          function ChatInput( {chatMessages, setChatMessages, setIsLoading} ) {
            const [inputText, setInputText] = React.useState('');

            function saveInputText(event) {
                setInputText(event.target.value);
            }

            function sendMessage() {
              if(!inputText.trim()) return;

              const newChatMessages = [
                 ...chatMessages,
                 {
                  message: inputText,
                  sender: 'user',
                  id: crypto.randomUUID()
                 }
                ];

               setChatMessages(newChatMessages);
               setInputText('');
               setIsLoading(true);

               setTimeout(() => {
               const response = Chatbot.getResponse(inputText);
                setChatMessages([
                 ...newChatMessages,
                 {
                  message: response,
                  sender: 'robot',
                  id: crypto.randomUUID()
                 }
               ]);

               setIsLoading(false);
                }, 1000);

               setInputText('');
            }

            return (
              <div className="chat-input-container">
                <input 
                  placeholder="Send a message to chatbot" 
                  size="30" 
                  onChange={saveInputText}
                  value={inputText}
                  className="chat-input"
                />
                <button 
                  onClick = {sendMessage}
                  className = "send-button"
                >Send</button>
              </div>
            );
          }

          function ChatMessage({message, sender}){
            //const message = props.message;
            //const sender = props.sender;
            //const {message, sender} = props;
            /*
            if(sender === "robot"){
              return (
                <div>
                  <img src="robot.png" width="30" />
                  {message}
                </div>
              );
            }
            */
              return (
                <div className={
                  sender === 'user'
                    ? 'chat-message-user'
                    : 'chat-message-robot'
                }>
                  {sender === 'robot' && (
                     <img
                       className="chat-message-profile"
                     src="robot.png" />
                  )}
                  <div 
                  className="chat-message-text">
                    {message}
                  </div>
                  {sender === 'user' && (
                     <img 
                       className="chat-message-profile"
                     src="user.png" />
                  )}
                </div>
              )
          }

          function useAutoScroll(dependencies) {
              const ref = React.useRef(null);

              React.useEffect(() => {
                const containerElem = ref.current;
              if(containerElem) {
                containerElem.scrollTop = containerElem.
                scrollHeight;
              }
              }, dependencies);

              return ref;
          }
          function ChatMessages({ chatMessages }) {

              const chatMessagesRef = useAutoScroll([chatMessages]);
            return (
              <div 
                className="chat-messages-container"
                ref={chatMessagesRef}
              >
                {chatMessages.map((chatMessage) => {
                  return (
                    <ChatMessage 
                      message={chatMessage.message}
                      sender={chatMessage.sender}
                      key={chatMessage.id}
                    />
                  );
                })}
              </div>
            );
          }

          function App() {
            const [isLoading, setIsLoading] = React.useState(false);
            const [chatMessages, setChatMessages] = React.useState([{
              message: 'hello chatbot',
              sender: 'user',
              id: 'id1'
            }, {
              message: 'Hello! How can I help you?',
              sender: 'robot',
              id: 'id2'
            }, {
              message: 'can you get me todays date?',
              sender: 'user',
              id: 'id3'
            }, {
              message: 'Today is 23 december',
              sender: 'robot',
              id: 'id4'
            }]);
            //const chatMessages = array[0];//tells about current data
            //const setChatMessages = array[1];//it updates the current data
            //const [chatMessages, setChatMessages] = array[];


            // JSX => JS + XML
            return(
              <div className="app-container">

              {isLoading && (
                <ChatMessage
                  message = {<img class="loading-img" src="loading-spinner.gif" width="24"/>}
                  sender="robot"
                />
              )}
              {chatMessages.length === 0 
                 ? <p>Welcome to the chatbot project! Send a message below.</p>
                 : null
              }
                <ChatMessages 
                  chatMessages={chatMessages}  //naming convention using same name
                  setChatMessages={setChatMessages}
                  setIsLoading={setIsLoading}
                />
                <ChatInput 
                  chatMessages={chatMessages}
                  setChatMessages={setChatMessages}
                  setIsLoading={setIsLoading}
                />
              </div>
            )
          }
          
          const container = document.querySelector('.js-container');
          ReactDOM.createRoot(container).render(<App />);
        </script>
    </div>
  </body>
</html>
